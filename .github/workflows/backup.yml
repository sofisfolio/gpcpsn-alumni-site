name: Encrypted backup
on:
  schedule:
    - cron: "41 20 * * 0,3"   # Sun & Wed, 02:11 IST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates gnupg lsb-release jq >/dev/null
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          curl -fsS https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Create encrypted backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] && [ -n "$BACKUP_PASSPHRASE" ] || { echo "Secrets missing: see docs/backup-restore.md"; exit 1; }
          bash scripts/backup.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: gpcpsn-encrypted-backup
          path: out/*.gpg
          retention-days: 30
